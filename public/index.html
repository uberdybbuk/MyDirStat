<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mydirstat</title>
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='9' height='9' x='0' y='0' fill='%234a86d8'/><rect width='7' height='5' x='9' y='0' fill='%23e0603c'/><rect width='7' height='4' x='9' y='5' fill='%234fb783'/><rect width='16' height='7' x='0' y='9' fill='%23e0a72e'/></svg>">
</head>
<body>
<div id="app">

    <header class="toolbar">
        <button id="up" class="icon" title="Scan parent directory">&#x2191;</button>
        <input id="path" class="path" spellcheck="false" autocomplete="off" placeholder="Directory to scan">
        <select id="roots" class="roots" title="Volumes"></select>
        <button id="scan" class="primary">Scan</button>
        <button id="cancel" class="danger" hidden>Stop</button>
        <button id="pick">Select&hellip;</button>

        <span class="spacer"></span>

        <div id="summary" class="summary"></div>
    </header>

    <div id="alert" class="alert" role="alert" hidden>
        <span class="alert-icon" aria-hidden="true">!</span>
        <span id="alertText"></span>
        <button id="alertClose" class="icon" title="Dismiss">&times;</button>
    </div>

    <div id="progress" class="progress" hidden>
        <div class="bar"><i></i></div>
        <div class="progress-text"><span id="progressPath"></span></div>
    </div>

    <nav id="crumbs" class="crumbs" aria-label="Zoom path"></nav>

    <main>
        <section class="row top" id="topRow">
            <section class="pane" id="treePane">
                <div class="pane-head tree-grid">
                    <button data-sort="name" class="col-name">Name</button>
                    <button data-sort="size" class="col-num on">Size<span class="grip" data-grip="size" title="Drag to resize, double-click to reset"></span></button>
                    <button data-sort="pct" class="col-pct">Share<span class="grip" data-grip="pct" title="Drag to resize, double-click to reset"></span></button>
                    <button data-sort="items" class="col-num">Items<span class="grip" data-grip="items" title="Drag to resize, double-click to reset"></span></button>
                    <button data-sort="mtime" class="col-date">Modified<span class="grip" data-grip="date" title="Drag to resize, double-click to reset"></span></button>
                </div>
                <div class="scroll" id="treeScroll" tabindex="0">
                    <div class="sizer" id="treeSizer"><div class="rows" id="treeRows"></div></div>
                </div>
            </section>

            <div class="splitter vertical" id="splitV" role="separator" aria-orientation="vertical"></div>

            <section class="pane" id="extPane">
                <div class="pane-head ext-grid">
                    <button data-esort="type" class="col-type">Type</button>
                    <button data-esort="size" class="col-num on">Size<span class="grip" data-grip="esize" title="Drag to resize, double-click to reset"></span></button>
                    <button data-esort="pct" class="col-pct">Share<span class="grip" data-grip="epct" title="Drag to resize, double-click to reset"></span></button>
                    <button data-esort="count" class="col-num">Files<span class="grip" data-grip="ecount" title="Drag to resize, double-click to reset"></span></button>
                </div>
                <div class="scroll" id="extScroll">
                    <div id="extRows"></div>
                </div>
            </section>
        </section>

        <div class="splitter horizontal" id="splitH" role="separator" aria-orientation="horizontal"></div>

        <section class="map" id="mapPane">
            <canvas id="map"></canvas>
            <div class="map-empty" id="mapEmpty">Scanning&hellip;</div>
        </section>
    </main>

    <footer class="status" id="status">
        <span id="statusPath" class="status-path"></span>
        <span id="statusMeta" class="status-meta"></span>
    </footer>
</div>

<div id="tip" class="tip" hidden></div>

<div id="menu" class="menu" hidden role="menu">
    <button data-op="zoom">Zoom in here</button>
    <button data-op="reveal">Show in file manager</button>
    <button data-op="open">Open</button>
    <hr>
    <button data-op="trash" class="danger">Move to Trash</button>
    <button data-op="delete" class="danger">Delete permanently&hellip;</button>
</div>

<div id="picker" class="modal" hidden>
    <div class="sheet wide" id="pickerSheet">
        <header class="review-head">
            <h2>Select files</h2>
            <span id="pickerTotals" class="dim"></span>
            <button id="pickerClose" class="icon" title="Close">&times;</button>
        </header>

        <div class="review-filters">
            <input id="pickerFilter" type="search" placeholder="Filter by name, path, or wildcards like *.cs;*.txt&hellip;" spellcheck="false">
            <button id="pickerTypes">Select by file type&hellip;</button>
            <span id="pickerBulk" class="bulk" hidden>
                <button id="pickerTakeAll">Select all</button>
                <button id="pickerDropAll">Deselect all</button>
            </span>
        </div>

        <div class="scroll picker-scroll" id="pickerScroll">
            <div class="sizer" id="pickerSizer"><div class="rows" id="pickerRows"></div></div>
        </div>

        <div class="sheet-actions">
            <span id="pickerNote" class="dim"></span>
            <span class="spacer"></span>
            <label class="fmt">
                Format
                <select id="pickerFormat"></select>
            </label>
            <button id="pickerTrash" class="danger">Move to Trash</button>
            <button id="pickerErase" class="danger">Delete permanently&hellip;</button>
            <button id="pickerClear">Clear</button>
            <button id="pickerDone">Close</button>
            <button id="pickerZip" class="primary">Compress &amp; Download</button>
        </div>
    </div>
</div>

<div id="types" class="modal" hidden>
    <div class="sheet wide types-sheet" id="typesSheet">
        <header class="review-head">
            <h2>Select file types</h2>
            <span id="typesTotals" class="dim"></span>
            <button id="typesClose" class="icon" title="Close">&times;</button>
        </header>

        <div class="review-filters">
            <input id="typesFilter" type="search" placeholder="Filter types&hellip;" spellcheck="false">
            <button id="typesAll">Select all</button>
            <button id="typesNone">Clear</button>
        </div>

        <div class="pane-head type-grid">
            <button data-tsort="type" class="col-type">Type</button>
            <button data-tsort="size" class="col-num on">Size</button>
            <button data-tsort="pct" class="col-pct">Share</button>
            <button data-tsort="count" class="col-num">Files</button>
        </div>
        <div class="scroll picker-scroll" id="typesScroll">
            <div class="sizer" id="typesSizer"><div class="rows" id="typesRows"></div></div>
        </div>

        <div class="sheet-actions">
            <span id="typesNote" class="dim"></span>
            <span class="spacer"></span>
            <button id="typesTrash" class="danger">Move to Trash</button>
            <button id="typesErase" class="danger">Delete permanently&hellip;</button>
            <button id="typesCancel">Cancel</button>
            <button id="typesOk" class="primary">OK</button>
        </div>
    </div>
</div>

<div id="confirmDelete" class="modal" hidden>
    <div class="sheet">
        <h2>Delete permanently</h2>
        <p id="confirmBody" class="dim"></p>
        <p class="dim">Type the file count to confirm:</p>
        <input id="confirmInput" type="text" inputmode="numeric" autocomplete="off" spellcheck="false">
        <div class="sheet-actions">
            <span class="spacer"></span>
            <button id="confirmCancel">Cancel</button>
            <button id="confirmGo" class="danger" disabled>Delete permanently</button>
        </div>
    </div>
</div>

<div id="delModal" class="modal" hidden>
    <div class="sheet">
        <h2 id="delTitle">Deleting</h2>
        <div class="bar"><i id="delBar"></i></div>
        <p id="delDetail" class="dim"></p>
        <p id="delPath" class="zip-path"></p>
        <ul id="delFailures" class="failures" hidden></ul>
        <div class="sheet-actions">
            <span class="spacer"></span>
            <button id="delCancel">Cancel</button>
            <button id="delClose" hidden>Close</button>
        </div>
    </div>
</div>

<div id="zipModal" class="modal" hidden>
    <div class="sheet">
        <h2 id="zipTitle">Creating archive</h2>
        <div class="bar"><i id="zipBar"></i></div>
        <p id="zipDetail" class="dim"></p>
        <p id="zipPath" class="zip-path"></p>
        <div id="zipHowto" class="howto" hidden>
            <span class="howto-label">Unpack with</span>
            <code id="zipCommand"></code>
        </div>
        <div class="sheet-actions">
            <span class="spacer"></span>
            <button id="zipCancel">Cancel</button>
            <button id="zipDownload" class="primary" hidden>Download</button>
            <button id="zipClose" hidden>Close</button>
        </div>
    </div>
</div>

<div id="modal" class="modal" hidden>
    <div class="sheet">
        <h2 id="modalTitle">Delete permanently</h2>
        <p id="modalBody"></p>
        <div class="sheet-actions">
            <button id="modalCancel">Cancel</button>
            <button id="modalConfirm" class="danger">Delete</button>
        </div>
    </div>
</div>

<script type="module" src="/js/client/app.js"></script>
</body>
</html>
